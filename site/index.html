    <script>
    // ── Minimal word-cloud layout (Archimedean spiral + AABB collision) ──
    function computeWordCloudLayout(words, width, height) {
        var placed = [];
        var cx = 0, cy = 0;
        function aabb(w) {
            return { x1: w.x - w.width/2, y1: w.y - w.height/2, x2: w.x + w.width/2, y2: w.y + w.height/2 };
        }
        function overlaps(a, b) {
            var r = a.x2 > b.x1 && a.x2 < b.x2 || b.x2 > a.x1 && b.x2 < a.x2;
            var c = a.y2 > b.y1 && a.y2 < b.y2 || b.y2 > a.y1 && b.y2 < a.y2;
            return r && c;
        }
        for (var i = 0; i < words.length; i++) {
            var w = words[i];
            w.width = w.size * w.text.length * 0.55;
            w.height = w.size * 1.2;
            w.rotate = (~~(Math.random() * 3) - 1) * 10;
            var a = 0, r = 0, step = 0.5;
            var found = false;
            while (r < Math.max(width, height)) {
                var x = Math.round(r * Math.cos(a));
                var y = Math.round(r * Math.sin(a) * 0.65);
                w.x = x; w.y = y;
                var box = aabb(w);
                if (box.x1 < -width/2 || box.x2 > width/2 || box.y1 < -height/2 || box.y2 > height/2) { a += step; r += step * 0.3; continue; }
                var collide = false;
                for (var j = 0; j < placed.length; j++) { if (overlaps(box, aabb(placed[j]))) { collide = true; break; } }
                if (!collide) { found = true; break; }
                a += step; r += step * 0.3;
            }
            if (found) placed.push(w);
        }
        return placed;
    }

        var lexicon = null;
        var ontologyMarkdown = '';
        var activeFilter = null;
        var hoveredWord = null;
        var layoutWords = [];

        async function init() {
            try {
                var lexRes = await fetch(LEXICON_URL);
                if (!lexRes.ok) throw new Error('lexicon.json 加载失败 (' + lexRes.status + ')');
                lexicon = await lexRes.json();

                var ontoRes = await fetch(ONTOLOGY_URL);
                if (ontoRes.ok) {
                    ontologyMarkdown = await ontoRes.text();
                }

                renderStats();
                renderFilters();
                renderWordCloud();
                renderSidebar();
                renderOntologyBody();
            } catch (err) {
                console.error('初始化失败:', err);
                document.getElementById('ontology-body').innerHTML =
                    '<p style="color:#ef4444;">数据加载失败: ' + escapeHtml(err.message) + '</p>' +
                    '<p style="color:var(--text-secondary);margin-top:0.5rem;">请确保通过 HTTP 服务器访问（如 python3 -m http.server），而非直接打开 HTML 文件。</p>';
                document.getElementById('wordcloud-container').innerHTML =
                    '<div class="wordcloud-error"><h3>数据加载失败</h3><p>' + escapeHtml(err.message) + '</p></div>';
            }
        }

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }

        function getUniquePaperCount() {
            var sources = {};
            lexicon.concepts.forEach(function(c) {
                (c.sourcePapers || []).forEach(function(s) { sources[s] = true; });
            });
            return Object.keys(sources).length;
        }

        function renderStats() {
            var bar = document.getElementById('stats-bar');
            var paperCount = getUniquePaperCount();
            var coreCount = lexicon.concepts.filter(function(c) { return c.weight >= 3; }).length;
            bar.innerHTML =
                '核心概念: <span>' + coreCount + '</span> &nbsp;|&nbsp;' +
                '关系: <span>' + lexicon.relationCount + '</span> &nbsp;|&nbsp;' +
                '版本: <span>' + lexicon.version + '</span> &nbsp;|&nbsp;' +
                '论文: <span>' + paperCount + ' 篇';
            document.getElementById('last-updated').textContent = lexicon.generatedAt || '2026-04-10';
        }

        function renderFilters() {
            var bar = document.getElementById('filter-bar');
            var cats = lexicon.categories;
            var html = '<button class="filter-btn active" data-cat="all">全部</button>';
            for (var key in cats) {
                if (cats.hasOwnProperty(key)) {
                    html += '<button class="filter-btn" data-cat="' + key + '">' + cats[key].name + '</button>';
                }
            }
            bar.innerHTML = html;

            bar.addEventListener('click', function(e) {
                if (!e.target.classList.contains('filter-btn')) return;
                var btns = document.querySelectorAll('.filter-btn');
                for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
                e.target.classList.add('active');
                activeFilter = e.target.dataset.cat === 'all' ? null : e.target.dataset.cat;
                layoutWords = [];
                renderWordCloud();
            });
        }

        function renderWordCloud() {
            var container = document.getElementById('wordcloud-container');
            var width = container.clientWidth - 24;
            var height = 450;

            var concepts = lexicon.concepts.filter(function(c) { return c.weight >= 3; });
            if (activeFilter) {
                concepts = concepts.filter(function(c) { return c.category === activeFilter; });
            }

            concepts = concepts.slice(0, 60);

            if (concepts.length === 0) {
                container.innerHTML = '<div class="wordcloud-error"><h3>暂无符合条件的概念</h3><p>该分类下没有 weight≥3 的核心概念</p></div>';
                return;
            }

            var words = concepts.map(function(c) {
                return {
                    text: c.name,
                    size: Math.max(14, Math.min(52, 12 + c.weight * 4)),
                    category: c.category,
                    id: c.id,
                    _concept: c,
                };
            });

            var colorMap = {};
            for (var key in lexicon.categories) {
                if (lexicon.categories.hasOwnProperty(key)) {
                    colorMap[key] = lexicon.categories[key].color;
                }
            }

            if (layoutWords.length > 0 && layoutWords.length === words.length) {
                for (var i = 0; i < words.length; i++) {
                    words[i].x = layoutWords[i].x;
                    words[i].y = layoutWords[i].y;
                    words[i].rotate = layoutWords[i].rotate;
                }
                draw(words, width, height, colorMap);
                return;
            }

            try {
                var placed = computeWordCloudLayout(words, width, height);
                layoutWords = placed.slice();
                draw(placed, width, height, colorMap);
            } catch (err) {
                console.error('词云布局失败:', err);
                container.innerHTML = '<div class="wordcloud-error"><h3>词云渲染失败</h3><p>' + escapeHtml(err.message) + '</p></div>';
            }
        }

        function draw(words, width, height, colorMap) {
            var container = document.getElementById('wordcloud-container');

            var html = '<svg id="wordcloud-svg" viewBox="0 0 ' + width + ' ' + height + '" class="wordcloud-svg">';
            html += '<g transform="translate(' + (width/2) + ',' + (height/2) + ')">';

            if (hoveredWord) {
                var hwConcept = null;
                for (var i = 0; i < words.length; i++) {
                    if (words[i].id === hoveredWord) { hwConcept = words[i]._concept; break; }
                }
                if (hwConcept) {
                    var relatedNames = {};
                    (hwConcept.relatedConcepts || []).forEach(function(r) { relatedNames[r] = true; });
                    var hoveredWordEl = null;
                    var relatedWords = [];
                    for (var j = 0; j < words.length; j++) {
                        var w = words[j];
                        if (w.id === hoveredWord) hoveredWordEl = w;
                        if (relatedNames[w.text]) relatedWords.push(w);
                    }
                    if (hoveredWordEl) {
                        relatedWords.forEach(function(rw) {
                            html += '<line class="relation-line" x1="' + hoveredWordEl.x + '" y1="' + hoveredWordEl.y +
                                '" x2="' + rw.x + '" y2="' + rw.y +
                                '" stroke="' + (colorMap[hwConcept.category] || '#94a3b8') + '"/>';
                        });
                    }
                }
            }

            for (var k = 0; k < words.length; k++) {
                var d = words[k];
                var cls = 'word';
                if (hoveredWord) {
                    var hw = null;
                    for (var m = 0; m < words.length; m++) {
                        if (words[m].id === hoveredWord) { hw = words[m]._concept; break; }
                    }
                    if (hw) {
                        var relN = {};
                        relN[hw.name] = true;
                        (hw.relatedConcepts || []).forEach(function(r) { relN[r] = true; });
                        cls += (d.text === hw.name || relN[d.text]) ? ' highlighted' : ' dimmed';
                    }
                }
                var fill = colorMap[d.category] || '#94a3b8';
                html += '<text class="' + cls + '" text-anchor="middle" ' +
                    'transform="translate(' + d.x + ',' + d.y + ')rotate(' + d.rotate + ')" ' +
                    'font-size="' + d.size + '" fill="' + fill + '" font-family="Inter, sans-serif" ' +
                    'data-id="' + d.id + '">' + escapeHtml(d.text) + '</text>';
            }

            html += '</g></svg>';
            container.innerHTML = html;

            var svg = document.getElementById('wordcloud-svg');
            var texts = svg.querySelectorAll('text.word');
            for (var n = 0; n < texts.length; n++) {
                (function(t) {
                    t.addEventListener('mouseenter', function() {
                        hoveredWord = t.getAttribute('data-id');
                        renderWordCloud();
                    });
                    t.addEventListener('mouseleave', function() {
                        hoveredWord = null;
                        renderWordCloud();
                    });
                    t.addEventListener('click', function() {
                        var id = t.getAttribute('data-id');
                        for (var p = 0; p < words.length; p++) {
                            if (words[p].id === id) {
                                showPaperSection(words[p]);
                                break;
                            }
                        }
                    });
                })(texts[n]);
            }
        }

        function showPaperSection(word) {
            var concept = word._concept || word;
            var name = concept.name || word.text;
            var papers = concept.sourcePapers || [];

            var section = document.getElementById('paper-section');
            var title = document.getElementById('selected-concept');
            var grid = document.getElementById('paper-grid');

            var catInfo = lexicon.categories[concept.category] || {name: concept.category, color: '#94a3b8'};
            title.textContent = name;
            title.style.color = catInfo.color;

            if (papers.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-secondary);">暂无关联论文</p>';
            } else {
                grid.innerHTML = papers.map(function(arxivId) {
                    var paperPath = PAPER_MAP[arxivId] || 'paper/search/' + arxivId;
                    return '<div class="paper-card">' +
                        '<span class="arxiv">' + escapeHtml(arxivId) + '</span>' +
                        '<p class="desc">概念 "' + escapeHtml(name) + '" 的来源论文</p>' +
                        '<a href="' + GITHUB_PAGES_BASE + paperPath + '" class="paper-link" target="_blank">查看完整报告 &rarr;</a>' +
                        '</div>';
                }).join('');
            }

            section.style.display = 'block';
            section.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function renderSidebar() {
            var nav = document.getElementById('sidebar-nav');
            if (!ontologyMarkdown) {
                nav.innerHTML = '<p style="font-size:0.82rem;color:var(--text-secondary);">本体正文未加载</p>';
                return;
            }

            var headings = [];
            var regex = /^(#{2,3})\s+(.+)$/gm;
            var match;
            while ((match = regex.exec(ontologyMarkdown)) !== null) {
                var level = match[1].length;
                var text = match[2].replace(/[*_`]/g, '').trim();
                var id = text.toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g, '-');
                headings.push({ level: level, text: text, id: id });
            }

            nav.innerHTML = headings.map(function(h) {
                var indent = (h.level - 2) * 0.75 + 0.75;
                return '<a href="#' + h.id + '" style="padding-left:' + indent + 'rem">' + h.text + '</a>';
            }).join('');
        }

        function renderOntologyBody() {
            var body = document.getElementById('ontology-body');
            if (!ontologyMarkdown) {
                body.innerHTML = '<p style="color:var(--text-secondary);">本体论正文加载中...</p>';
                return;
            }

            try {
                body.innerHTML = marked.parse(ontologyMarkdown);
            } catch (err) {
                body.innerHTML = '<p style="color:#ef4444;">正文渲染失败: ' + escapeHtml(err.message) + '</p>';
                return;
            }

            var h2h3 = body.querySelectorAll('h2, h3');
            for (var i = 0; i < h2h3.length; i++) {
                var id = h2h3[i].textContent.toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g, '-');
                h2h3[i].id = id;
            }
        }

        init();

        var resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                layoutWords = [];
                renderWordCloud();
            }, 250);
        });
    })();
    </script>
