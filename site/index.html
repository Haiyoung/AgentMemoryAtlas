    <script>
    // ── Custom Canvas word cloud: spiral layout + fish-like swim ──
    function createWordCloud(containerId, concepts, colorMap) {
        var container = document.getElementById(containerId);
        if (!container) return null;

        while (container.firstChild) {
            container.removeChild(container.firstChild);
        }

        var dpr = window.devicePixelRatio || 1;
        var w = container.clientWidth;
        var h = 500;

        var canvas = document.createElement('canvas');
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        container.appendChild(canvas);

        var ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);

        var halfW = w / 2, halfH = h / 2;

        // Build word entries
        ctx.font = '14px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif';
        var words = [];
        for (var i = 0; i < concepts.length; i++) {
            var c = concepts[i];
            var fontSize = Math.max(14, Math.min(52, 12 + (c.weight || 2) * 4));
            ctx.font = 'bold ' + fontSize + 'px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif';
            var tw = ctx.measureText(c.name).width;
            words.push({
                text: c.name,
                w: tw + 4,
                h: fontSize + 4,
                size: fontSize,
                weight: c.weight || 2,
                category: c.category,
                color: colorMap[c.category] || '#94a3b8',
                concept: c,
            });
        }

        // Sort largest first for initial placement
        words.sort(function(a, b) { return b.size - a.size; });

        // Spiral initial placement
        var PAD = 4;
        for (var i = 0; i < words.length; i++) {
            var wd = words[i];
            var angle = Math.random() * Math.PI * 2;
            var radius = 0, step = 0.15, limit = Math.max(halfW, halfH) * 2.5;
            while (radius < limit) {
                wd.baseX = radius * Math.cos(angle);
                wd.baseY = radius * Math.sin(angle) * 0.55;
                var bx1 = wd.baseX - wd.w/2 - PAD, by1 = wd.baseY - wd.h/2 - PAD;
                var bx2 = wd.baseX + wd.w/2 + PAD, by2 = wd.baseY + wd.h/2 + PAD;
                if (bx1 < -halfW || bx2 > halfW || by1 < -halfH || by2 > halfH) {
                    angle += step; radius += step * 0.5; continue;
                }
                var collide = false;
                for (var j = 0; j < i; j++) {
                    var p = words[j];
                    if (bx1 < p.baseX + p.w/2 + PAD && bx2 > p.baseX - p.w/2 - PAD &&
                        by1 < p.baseY + p.h/2 + PAD && by2 > p.baseY - p.h/2 - PAD) {
                        collide = true; break;
                    }
                }
                if (!collide) break;
                angle += step; radius += step * 0.5;
            }
        }

        // Assign velocity vectors (fish-like swimming)
        for (var i = 0; i < words.length; i++) {
            var wd = words[i];
            wd.x = wd.baseX;
            wd.y = wd.baseY;
            var angle = Math.random() * Math.PI * 2;
            var speed = 0.4 + Math.random() * 0.3;
            wd.vx = Math.cos(angle) * speed;
            wd.vy = Math.sin(angle) * speed;
            // Gentle direction change over time
            wd.turnSpeed = 0.02 + Math.random() * 0.03;
            wd.turnPhase = Math.random() * Math.PI * 2;
        }

        // Animation
        var t0 = Date.now();
        var running = true;
        var hovered = null;

        function render(timestamp) {
            if (!running) return;
            var t = (timestamp - t0) / 1000;

            ctx.clearRect(0, 0, w, h);

            // Update positions
            for (var i = 0; i < words.length; i++) {
                var wd = words[i];

                // Slow direction change (gentle turning like fish)
                var turnAngle = Math.sin(t * wd.turnSpeed + wd.turnPhase) * wd.turnSpeed;
                var currentAngle = Math.atan2(wd.vy, wd.vx);
                var newAngle = currentAngle + turnAngle;
                var speed = Math.sqrt(wd.vx * wd.vx + wd.vy * wd.vy);
                wd.vx = Math.cos(newAngle) * speed;
                wd.vy = Math.sin(newAngle) * speed;

                // Move
                wd.x += wd.vx;
                wd.y += wd.vy;

                // Bounce off walls
                var margin = 10;
                if (wd.x - wd.w/2 < -halfW + margin) {
                    wd.x = -halfW + wd.w/2 + margin;
                    wd.vx = Math.abs(wd.vx);
                }
                if (wd.x + wd.w/2 > halfW - margin) {
                    wd.x = halfW - wd.w/2 - margin;
                    wd.vx = -Math.abs(wd.vx);
                }
                if (wd.y - wd.h/2 < -halfH + margin) {
                    wd.y = -halfH + wd.h/2 + margin;
                    wd.vy = Math.abs(wd.vy);
                }
                if (wd.y + wd.h/2 > halfH - margin) {
                    wd.y = halfH - wd.h/2 - margin;
                    wd.vy = -Math.abs(wd.vy);
                }

                // Draw
                ctx.font = (wd.size >= 28 ? 'bold ' : '400 ') + wd.size + 'px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif';
                ctx.fillStyle = wd.color;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                if (hovered === i) {
                    ctx.save();
                    ctx.shadowColor = wd.color;
                    ctx.shadowBlur = 12;
                    ctx.fillText(wd.text, halfW + wd.x, halfH + wd.y);
                    ctx.restore();
                } else {
                    ctx.fillText(wd.text, halfW + wd.x, halfH + wd.y);
                }
            }

            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);

        // Hit detection
        function hitTest(clientX, clientY) {
            var rect = canvas.getBoundingClientRect();
            var mx = (clientX - rect.left) * (canvas.width / rect.width / dpr);
            var my = (clientY - rect.top) * (canvas.height / rect.height / dpr);
            for (var i = words.length - 1; i >= 0; i--) {
                var wd = words[i];
                if (mx >= halfW + wd.x - wd.w/2 && mx <= halfW + wd.x + wd.w/2 &&
                    my >= halfH + wd.y - wd.h/2 && my <= halfH + wd.y + wd.h/2) {
                    return i;
                }
            }
            return -1;
        }

        canvas.addEventListener('click', function(e) {
            // Word cloud click disabled — papers browsed in the paper list section below
        });

        canvas.addEventListener('mousemove', function(e) {
            var idx = hitTest(e.clientX, e.clientY);
            hovered = idx >= 0 ? idx : null;
            canvas.style.cursor = hovered !== null ? 'pointer' : 'default';
        });

        canvas.addEventListener('mouseleave', function() {
            hovered = null;
        });

        return {
            stop: function() {
                running = false;
            }
        };
    }
    </script>

# Agent Memory 领域本体论 v1.1

## 一、本体论核心基础

Agent Memory 本体论旨在为 Agent Memory 领域建立一个统一的概念框架。该框架采用"三维正交分类 + 类层级"双轨架构：三维正交分类提供概念的坐标空间，类层级提供概念的语义归属。两者正交共存，确保每个概念既有明确的语义定位，又可在多维空间中被精确定位。

### 1.1 三维正交分类

每个记忆概念由三个维度的坐标唯一确定。三个维度相互正交——同一概念可在不同维度上同时拥有坐标值。

**载体维度（Carrier）** 定义记忆的物质承载形式：

| 载体类型 | 说明 | 典型实例 |
|----------|------|----------|
| Token-level（标记级） | 以文本令牌为载体的短期记忆 | 上下文窗口、Prompt 序列、滑动窗口 |
| Parametric（参数） | 以模型权重为载体的内化记忆 | LoRA 适配器、微调参数、MLP 记忆模块 |
| External（外部） | 以外部存储为载体的持久记忆 | 向量数据库、知识图谱、Memory Bank |
| Latent（隐式） | 以隐式表示为载体的记忆 | 隐状态、潜在表征、注意力模式 |

**功能维度（Function）** 定义记忆的认知功能定位：

| 功能类型 | 认知定位 | 典型实例 |
|----------|----------|----------|
| Factual（事实） | 离散客观信息 | 用户偏好、世界常识、结构化事实 |
| Semantic（语义） | 概念关联与知识网络 | 知识图谱、语义锚点、概念层级 |
| Episodic（情景） | 交互事件与时间线索 | 对话历史、交互轨迹、事件图 |
| Procedural（程序） | 可执行技能与操作流程 | 工具调用序列、API 技能、SOP |
| Experiential（经验） | 成功/失败轨迹与迁移知识 | 跨域经验、反馈诊断、启发式策略 |
| Working（工作） | 即时认知工作区 | 动态上下文、活跃推理链 |
| Reflection（反思） | 元认知与自我觉察 | 反思经验、演化信念、自我模型 |

**动态维度（Dynamic）** 定义记忆的生命周期操作：

| 操作类型 | 生命周期阶段 | 典型实例 |
|----------|----------|----------|
| Formation（形成） | 记忆创建与编码 | MEM_WRITE、门控写入、惊喜度编码 |
| Retrieval（检索） | 信息召回与匹配 | 语义检索、相似度匹配、层次检索 |
| Evolution（演化） | 知识更新与整合 | Memory Update、知识融合、增量编辑 |
| Forgetting（遗忘） | 低价值记忆淘汰 | 时间衰减、LFU 淘汰、记忆修剪 |
| Reflection（反思） | 元层次评估与重构 | 反思生成、夜间自评、洞察提取 |
| Association（关联） | 跨记忆关联建立 | 上下文集成、关系感知链接 |

### 1.2 顶层核心类（8 个）

本体论的类层级以 8 个顶层类为根节点，覆盖 Agent Memory 系统的完整语义空间：

| 顶层类 | 核心定位 | 职责范围 |
|--------|---------|---------|
| Agent | 记忆主体 | 记忆的拥有者与使用者，执行记忆操作 |
| Memory | 记忆载体 | 记忆的承载实体（含参数/外部/Token 等形式） |
| MemorySystem | 记忆管理架构 | 记忆的组织、协调与调度基础设施 |
| MemoryEvent | 记忆触发源 | 引发记忆操作的内部或外部事件 |
| MemoryOperation | 记忆操作行为 | 对记忆执行的写入、检索、更新、遗忘等操作 |
| Context | 记忆关联场景 | 记忆操作发生的环境与上下文约束 |
| Entity | 记忆关联对象 | 记忆内容涉及的对象与关系 |
| Policy | 记忆操作规则 | 控制记忆行为的安全策略与访问规则 |

### 1.3 核心原则

- **语义唯一性**：每个概念在模型中具有唯一的语义标识，同名概念必须归并
- **正交独立性**：三个维度相互独立——载体变化不改变功能，功能变化不改变载体
- **层级清晰性**：类→子类层级与三维分类正交共存，概念可同时具有类归属和坐标值
- **工程适配性**：概念设计兼顾理论完整性与工程可实现性，避免纯理论构造
- **可扩展性**：新增概念可归入现有维度或触发维度扩展，模型保持开放
- **闭环完整性**：记忆生命周期形成闭环（形成→组织→巩固→检索→遗忘→反思→形成）

## 二、核心公理体系

公理是本体论中不可再分的断言，构成领域模型的推理基础。以下公理从 Agent Memory 领域的结构性规律中归纳得出。

### 2.1 存在公理

- **载体必要性**：每个记忆实例必须占据至少一个载体维度位置（Token-level/Parametric/External/Latent），不存在无载体的记忆
- **事件依赖性**：没有无来源的记忆——每条记忆必须关联至少一个 MemoryEvent（用户输入、系统输出、环境信号等）
- **多维共存**：一个记忆实例可同时具有多个维度的坐标值（如 External 载体 + Factual 功能 + Retrieval 操作）

### 2.2 操作公理

- **索引约束**：任何 MemoryRetrieval 操作必须有对应的 Index 结构支撑，无索引即无法检索
- **遗忘不可逆**：MemoryForgetting 操作不产生可恢复的记忆副本，遗忘是单向的信息损失过程
- **反思增量性**：MemoryReflection 操作必然产生至少一个新增概念实例——反思不只是回顾，而是知识生成
- **操作闭合性**：所有 MemoryOperation 的输入和输出均在本体论定义的类空间内，不存在域外操作

### 2.3 质量公理

- **质量三元组**：记忆质量是新鲜度（Freshness）、一致性（Consistency）与置信度（Confidence）的函数，三者缺一不可
- **属性非独立**：质量维度作为 Memory 的属性而非独立类存在——质量内生于记忆实例
- **时效衰减律**：记忆的新鲜度随时间单调递减，除非通过检索或巩固操作刷新

### 2.4 安全公理

- **风险正比律**：记忆检索深度与隐私泄露风险正相关——检索越深，暴露越多
- **攻击面差异**：格式化检索（基于关键词/模板）比语义检索更易受提示词操纵攻击
- **隔离必要性**：敏感记忆操作必须在安全沙箱中执行，防止记忆内容被未授权访问

### 2.5 演进公理

- **使用强化律**：记忆随使用而强化——accessCount 增加导致 importance 增加，频繁访问的记忆更持久
- **时间衰减律**：记忆随时间而衰减——长期未访问的记忆 importance 递减，直至触发遗忘
- **最小扰动原则**：记忆编辑（如 Knowledge Editing）应遵循最小权重变更原则，避免灾难性遗忘
- **一致性优先**：当新旧记忆冲突时，系统应优先维护全局一致性而非局部精确性

## 四、记忆架构模式

对 322 种记忆结构与 319 种记忆载体的聚类分析表明，Agent Memory 系统在实践中收敛为 **五种主导架构范式**。每种范式代表一组协同的载体选择、组织策略与操作模式。

### 4.1 外部检索架构（External Retrieval Architecture）

以 **向量数据库**（Vector Database / FAISS / ChromaDB）与 **图数据库**（Graph Database）为核心载体，将记忆持久化于模型之外，通过语义检索或图遍历注入推理上下文。该范式涵盖 Vector Index、Knowledge Graph、Memory Bank 等数十种结构变体，对应三维分类中的 External 载体维度，以 Factual 与 Semantic 功能为主，支撑 Retrieval、Summarization、Evolution 等动态操作。这是当前 Agent Memory 中最主流的架构模式，代表论文数量最多。

### 4.2 上下文窗口架构（Context Window Architecture）

以 **LLM 上下文窗口**（Context Window / Token Sequence / Prompt Context）为唯一载体，记忆以原始文本、摘要或压缩令牌的形式驻留于模型输入上下文内。该范式包含滑动窗口、优先级修剪、Token-based Context 等结构，属于 Token-level 载体维度，天然支持 Working 与 Episodic 功能，其动态特征集中于 Formation（写入上下文）与 Forgetting（上下文溢出/压缩）。随着上下文窗口的不断扩大，该范式的重要性持续上升。

### 4.3 参数化架构（Parametric Architecture）

将记忆编码入 **模型参数**（Model Weights / LoRA Adapters / Hyper-network Parameters / MLP Memory Module），通过微调、持续学习或模型编辑实现知识内化。该范式对应 Parametric 载体维度，涵盖 Fine-tuned Parameter Space、Perturbation Vector、Test-Time Updatable Weight Matrix 等结构。功能上偏向 Factual 与 Procedural 记忆，动态操作包括 Learning（SFT/RL）、Evolution（参数更新）与 Forgetting（权重衰减）。参数化架构的优势在于零推理延迟，但更新成本高且可解释性弱。

### 4.4 图结构架构（Graph-Based Architecture）

以 **图/树结构**（Knowledge Graph / Memory Graph / Hierarchical Tree / Scene Graph / Event Graph）为核心组织形式，将记忆建模为实体-关系网络。该范式包含 44 种图/树结构变体，载体可为 External（外部图数据库）或 Latent（隐式图表示），功能上覆盖 Factual、Semantic、Episodic 三大类，动态操作以 Association（关联链接）、Reflection（反思合成）和 Evolution（图更新）为特征。图结构的优势在于显式关系推理与可编辑性，是知识密集型场景的首选。

### 4.5 混合多层架构（Hybrid Multi-Tier Architecture）

组合两种以上载体维度，构建 **分层记忆系统**（Hierarchical Memory Architecture / Hybrid Memory Architecture / Three-layer Memory System / Dual-module Memory Framework）。该范式典型模式为：短期 Token-level 记忆（上下文窗口）+ 中期 External 记忆（向量/图数据库）+ 长期 Parametric 记忆（微调参数），辅以中央记忆控制器（Memory Orchestrator）协调各层间的 Formation、Retrieval、Consolidation 与 Forgetting 流程。混合架构对应 Agent Memory 本体中 MemorySystem 类，代表了从单一记忆机制向系统化记忆工程的演进方向。

### 架构范式总结

## 五、记忆功能范式

基于 325 个记忆功能概念的系统分析，Agent 记忆的功能定位可归纳为五大核心范式。这些范式与三维分类体系中的功能维度正交映射，共同构成智能体记忆的完整功能图谱。

### 5.1 陈述性记忆 (Declarative Memory) — 智能体所知

陈述性记忆承载智能体对世界的事实性认知，回答"智能体知道什么"。它包含三个子类型：**事实记忆**存储离散的客观信息（用户偏好、世界常识、结构化事实）；**语义记忆**组织概念间的关联网络（知识图谱、语义锚点、概念层级）；**情景记忆**记录具体的交互事件与时间线索（对话历史、交互轨迹、事件图）。三者形成从原子事实到语义网络再到情景叙事的递进结构，对应 Function 维度的 Factual / Semantic / Episodic 坐标。

### 5.2 程序与经验记忆 (Procedural & Experiential Memory) — 智能体所能

此类记忆编码"智能体如何做"的知识。**程序记忆**存储可执行的技能与操作流程（工具调用序列、API 技能、SOP 编码知识），具有可重复调用、模块化组合的特征。**经验记忆**记录过往任务中的成功/失败轨迹、跨域迁移经验和反馈诊断，为策略选择提供启发式指导。两者协同工作：程序记忆提供"怎么做"的脚本，经验记忆提供"何时用"的判断，对应 Function 维度的 Procedural / Experiential。

### 5.3 工作记忆 (Working Memory) — 智能体所思

工作记忆是智能体当前的认知工作区，承载即时任务处理所需的活跃信息。它包括**工作记忆**本身（动态上下文工作区、活跃推理链）、**短期记忆**（近期操作历史、短期感知保留）以及**感官记忆**（原始感知输入的瞬时保留）。工作记忆容量受限、更新频繁，是感知输入与长期存储之间的缓冲地带，对应 Function 维度的 Working 坐标，与 Dynamic 维度的 Retrieval / Formation 操作紧密耦合。

### 5.4 长期记忆 (Long-Term Memory) — 智能体所记

长期记忆提供跨会话、跨时间的持久存储能力。它不是独立的功能类型，而是**时间维度的存储策略**——上述陈述性、程序性、经验性内容经巩固后均可进入长期存储。概念变体体现了不同的时间敏感性（时间敏感长期记忆、终生交互记忆）、不同的巩固机制（长期语义巩固、神经生物学启发机制）和不同的持久性级别（中期记忆、持久记忆）。Parametric Memory（参数化记忆）作为特殊子类，将知识固化于模型权重中，与非参数化的外部长期记忆形成互补。

### 5.5 反思与元记忆 (Reflective & Meta-Memory) — 智能体所学

反思记忆使智能体具备对自身认知过程的觉察能力。它通过对过往交互的反思合成（Reflective Synthesis、推理困境检测）产生新的洞察，包括**反思经验**（对自身推理过程的元认知）、**演化信念**（对自我能力与限制的动态评估）以及**自我模型**（Creed、能力清单等元描述）。这是唯一能产生增量知识的函数范式——其他范式存储和检索已有信息，反思范式则生成全新内容，对应 Function 维度的 Reflection 坐标。

### 5.6 功能范式交互关系

五大范式并非孤立存在，而是通过记忆生命周期操作形成闭环：

\`\`\`
感官输入 ──▶ 工作记忆 ──▶ 陈述性/程序性/经验记忆
  │              │                    │
  │              ▼                    ▼
  │         (短期遗忘)          (巩固/编码)
  │              │                    │
  │              │                    ▼
  │              │              长期记忆 ◀── 参数化记忆
  │              │                    │
  │              │               (检索激活)
  │              ▼                    │
  │         反思记忆 ─────────────────┘
  │              │
  │         (元认知更新)
  └──────────────┘  (反馈调节注意与编码策略)
\`\`\`

| 源范式 | 目标范式 | 驱动操作 | 语义流向 |
|--------|---------|---------|---------|
| 感官/短期 | 工作记忆 | 注意选择、上下文组装 | 原始输入 → 活跃表征 |
| 工作记忆 | 陈述性/程序/经验 | 编码、摘要、结构化 | 活跃表征 → 持久知识 |
| 陈述性/程序/经验 | 长期记忆 | 巩固、索引、压缩 | 持久知识 → 长期存储 |
| 长期记忆 | 工作记忆 | 语义/情景检索 | 长期存储 → 活跃上下文 |
| 所有范式 | 反思记忆 | 反思合成、元认知评估 | 经验 → 新洞察 |
| 反思记忆 | 所有范式 | 策略更新、信念修正 | 新洞察 → 认知调节 |

## 六、记忆生命周期

基于 445 个记忆操作概念的语义聚类，Agent 记忆的生命周期可归纳为六个阶段，形成一个持续演化的闭环。

\`\`\`mermaid
graph LR
    A["记忆形成\\nFormation"] --> B["记忆组织\\nOrganization"]
    B --> C["记忆巩固\\nConsolidation"]
    C --> D["记忆检索\\nRetrieval"]
    D --> E["记忆遗忘\\nForgetting"]
    D --> F["记忆反思\\nReflection"]
    F -.->|"产生新知"| A
    F -.->|"修正信念"| C
    E -.->|"释放资源"| A
\`\`\`

### 6.1 记忆形成（Formation）

外部信号或内部事件触发新记忆的创建。系统通过感知过滤（Perceive/Filter）筛选输入内容，经编码（Encoding）后写入相应的记忆载体。关键操作包括直接写入（MEM_WRITE、Add、Insertion）、门控写入（Gated Write/Update）、惊喜度驱动编码（Surprise-Driven Encoding）以及快速路径摄取（Fast Path Ingestion）。形成阶段的质量约束由新鲜度阈值和载体容量决定；形成后的记忆进入组织阶段，接受结构化处理。

### 6.2 记忆组织（Organization）

原始记忆内容被转化为结构化的知识表示。系统执行摘要压缩（Summarization、Context Compression）、实体关系提取（Entity-Relation Extraction）、索引构建（Index Building）、事件分段（Event Segmentation）和语义去重（Semantic Deduplication）。组织过程将碎片化内容聚合成层次化结构（树、图、向量索引），并建立跨记忆的关联关系。质量由信息密度和结构一致性衡量；组织完成的记忆进入巩固阶段。

### 6.3 记忆巩固（Consolidation）

记忆通过整合、更新和强化获得持久性。系统执行记忆更新（Memory Update）、知识融合（Knowledge Fusion）、冲突消解（Conflict Resolution）、增量编辑（Incremental Delta Update）和轨迹同化（Trajectory Assimilation）。巩固阶段遵循演进公理：频繁访问的记忆被强化，矛盾信息通过一致性约束进行编辑。质量由置信度和一致性评估；巩固后的记忆可供检索，也可被反思阶段回溯修正。

### 6.4 记忆检索（Retrieval）

在任务驱动下从记忆库中召回相关信息。这是操作概念最密集的阶段，涵盖语义检索（Semantic Retrieval）、相似度匹配（Similarity-based Retrieval）、层次检索（Hierarchical Retrieval）、混合检索（Hybrid Retrieval）、图遍历检索（Graph Traversal）和上下文感知检索（Context-aware Retrieval）等多种策略。检索质量由召回率、精确度和延迟共同衡量；检索结果既服务于当前任务执行，也触发遗忘评估和反思生成。

### 6.5 记忆遗忘（Forgetting）

低价值或过时记忆被有计划地淘汰。系统执行时间衰减（Time-based Decay、Forgetting Curve Decay）、记忆修剪（Memory Pruning）、LFU 淘汰（LFU Eviction）、基于效用的删除（Utility-based Deletion）和状态回滚（State Rollback）。遗忘并非完全被动——竞争性抑制（Competitive-Inhibitory Forgetting）和选择性遗忘（Selective Forgetting）机制使系统能够主动清理干扰信息。遗忘释放的载体资源可被新记忆复用。

### 6.6 记忆反思（Reflection）

系统对自身记忆进行元层次的评估与重构。操作包括反思生成（Reflection Generation）、夜间自评（Nightly Self-Critique）、洞察提取（Insight Extraction）、轨迹反思（Trajectory Reflection）和失败感知反思（Failure-aware Reflection）。反思产生新的事实或程序性知识，回写至形成阶段；同时识别并修正错误的信念，触发巩固阶段的更新。

### 6.7 跨阶段关注（Cross-Cutting Concerns）

以下机制贯穿多个生命周期阶段：

- **重要性评分与排序（Scoring & Ranking）**：重要性评分影响形成阶段的写入决策、巩固阶段的保留策略和遗忘阶段的淘汰阈值。个性化 PageRank、距离加权评分和动态重要性过滤在不同阶段以统一的价值函数运作。
- **学习机制（Learning）**：持续预训练（Continual Pre-training）、后训练对齐（Post-training Alignment）和约束生成（Constrained Generation）跨越全生命周期，使记忆系统的参数化知识与非参数化记忆协同进化。
- **安全与策略（Policy & Safety）**：隐私分级访问控制、检索深度限制和格式化检索防护贯穿所有操作阶段，确保记忆行为符合安全公理。

## 七、记忆安全与治理

Agent Memory 系统的安全与治理涵盖五个核心维度，确保记忆在全生命周期中的可靠性、可控性与可审计性。这些治理约束是从本体概念的分类关系（is-a / part-of / related-to）与验证公理中归纳得出的跨切面关注点。

### 7.1 治理维度

**隐私与安全 (Privacy & Security)**：记忆检索深度与泄露量正相关，基于格式的检索比语义检索更易受提示词操纵。治理策略包括访问控制策略 (Access Control Policy)、PII 加密存储、检索深度限制、安全沙箱隔离，以及对抗性攻击防御 (Adversarial Defense)。影响核心类：**Policy**（安全策略定义）、**Memory**（被保护载体）、**MemoryOperation**（受控操作）、**Agent**（操作主体）。

**一致性与冲突解决 (Consistency & Conflict Resolution)**：外部检索记忆与内部参数知识可能发生冲突；全量重写会导致上下文坍塌 (Context Collapse)；事实 (Observation) 与推断 (Belief) 必须严格区分。治理机制包括软提示调制 (Soft Prompt Modulation)、增量更新 (Incremental Update)、语义去重、基于时间权重的冲突仲裁、以及正交参数更新约束 (Null-Space Constraint)。影响核心类：**Memory**（冲突载体）、**MemoryOperation**（解决手段）、**Context**（一致性场景）、**Entity**（事实/推断区分）。

**质量评估 (Quality Assessment)**：记忆质量是新鲜度 (Freshness)、一致性 (Consistency) 与置信度 (Confidence) 的函数。验证指标包括检索准确率 (F1/F2)、困惑度变化 (PPL)、下游任务成功率、记忆质量评分 (Q-value)、以及遗忘率边界 (<0.05)。治理机制包括动态重要性评分、检索-精炼验证 (Retrieve-Refine Verification)、以及基于用户反馈的质量修正。影响核心类：**Memory**（质量承载）、**MemoryOperation**（评估/修正）、**MemoryEvent**（质量触发源）、**Agent**（评估执行者）。

**演化约束 (Evolution Constraints)**：记忆编辑需遵循最小扰动原则 (Minimal Perturbation)，避免灾难性遗忘；自我演进代码必须在沙箱中执行；关键进化节点需保留人工干预机制；实证有益性 (Empirical Beneficence) 替代理论最优证明。治理策略包括变更审计轨迹 (Audit Trail)、回滚能力、版本快照、以及多路径并行探索避免局部最优。影响核心类：**MemoryOperation**（变更操作）、**Policy**（约束规则）、**MemorySystem**（演进平台）、**MemoryEvent**（演化触发）。

**结构完整性 (Structural Integrity)**：索引与存储分离架构要求索引一致性验证；图谱结构需保证引用有效性 (Reference Validity)；记忆节点需支持多对多映射 (Many-to-Many Mapping) 以捕捉信息多义性；孤儿节点需通过垃圾回收机制检测与清理。影响核心类：**MemorySystem**（结构管理）、**Memory**（结构载体）、**Context**（引用关系）、**Entity**（节点有效性）。

### 7.2 治理框架总览

|---------|---------|-----------|---------|
| 隐私与安全 | 访问控制、检索深度限制、沙箱隔离、对抗防御 | Policy, Memory, MemoryOperation, Agent | EN/CER 泄露量化、攻击成功率测试 |

## 八、未来演进方向

Agent Memory 领域正处于从**工程探索**向**系统化学科**演化的关键阶段。

**短期（2025-2026）：基础设施标准化**——统一检索接口以减少工程碎片化，建立质量评估基准（新鲜度/一致性/置信度），完善检索增强场景下的隐私防御，扩展多模态记忆载体支持。

**中期（2027-2028）：认知能力深化**——实现自动化反思与信念更新循环，建立跨 Agent 记忆共享协议，开发记忆演化可观测工具链，标准化记忆-决策因果链路分析。

**长期（2029+）：理论体系建立**——探索记忆自组织结构与涌现智能，建立 Agent Memory 形式化验证体系，实现跨模态记忆迁移与泛化，定义 Agent Memory 伦理与安全框架。

ance on long-context benchmarks (BABILong) compared to standard baselines", "source": "2502.06049"}, {"type": "validation", "text": "Integration of memory modules does not degrade performance on general knowledge benchmarks (MMLU)", "source": "2502.06049"}, {"type": "theoretical", "text": "记忆容量与泄露绝对数量呈正相关 (Memory capacity is positively correlated with leakage volume)", "source": "2502.13172"}, {"type": "theoretical", "text": "基于格式的检索比语义检索更易受提示词操纵 (Format-based retrieval is more vulnerable to prompt manipulation than semantic retrieval)", "source": "2502.13172"}, {"type": "validation", "text": "提取数量 (EN) 和完全提取率 (CER) 可有效量化隐私风险 (EN and CER effectively quantify privacy risk)", "source": "2502.13172"}, {"type": "validation", "text": "检索深度 (k 值) 增加会加剧记忆泄露 (Increasing retrieval depth k exacerbates memory leakage)", "source": "2502.13172"}, {"type": "theoretical", "text": "基于语言的全局记忆会丢失几何信息，阻碍复杂环境下的空间推理", "source": "2502.14254"}, {"type": "theoretical", "text": "纯自我视角观测面临部分可观测决策问题，易导致次优决策", "source": "2502.14254"}, {"type": "theoretical", "text": "全局上下文与局部感知的动态对齐能显著增强长程任务的空间推理能力", "source": "2502.14254"}, {"type": "validation", "text": "Mem2Ego 在物体导航任务上的成功率和路径效率优于现有 SOTA 方法", "source": "2502.14254"}, {"type": "validation", "text": "移除全局记忆或自适应检索模块会导致导航性能显著下降", "source": "2502.14254"}, {"type": "validation", "text": "该方法在仿真环境中有效改善了长程导航中的迷失问题", "source": "2502.14254"}, {"type": "theoretical", "text": "Hippocampal-Neocortical Complementarity maps to Offline Indexing and Online Retrieval stages.", "source": "2502.14802"}, {"type": "theoretical", "text": "Non-parametric memory storage prevents catastrophic forgetting in continual learning scenarios.", "source": "2502.14802"}, {"type": "validation", "text": "Hybrid graph structure improves multi-hop reasoning without degrading fact memory performance.", "source": "2502.14802"}, {"type": "validation", "text": "Token consumption is inversely proportional to retrieval efficiency in structured RAG systems.", "source": "2502.14802"}, { ical", "text": "Experience abstracted as executable code APIs enhances robustness and reusability compared to text-based memory.", "source": "2504.07079"}, {"type": "theoretical", "text": "Self-improvement in web agents requires a closed loop of exploration, synthesis, and optimization.", "source": "2504.07079"}, {"type": "validation", "text": "Skill transfer from strong to weak agents significantly improves task success rates (up to 54.3%).", "source": "2504.07079"}, {"type": "validation", "text": "Reusable skills reduce exploration costs and improve generalization in unknown web environments.", "source": "2504.07079"}, {"type": "theoretical", "text": "LLM 推理无状态缺陷可通过外部记忆机制弥补", "source": "2504.07952"}, {"type": "theoretical", "text": "无需梯度更新即可在测试时实现知识积累", "source": "2504.07952"}, {"type": "theoretical", "text": "记忆策展优于全量存储以避免上下文爆炸", "source": "2504.07952"}, {"type": "validation", "text": "跨查询记忆积累能显著降低重复错误率", "source": "2504.07952"}, {"type": "validation", "text": "动态记忆机制在复杂推理任务中比静态检索更有效", "source": "2504.07952"}, {"type": "validation", "text": "策略复用比单纯增加指令更能提升性能", "source": "2504.07952"}, {"type": "theoretical", "text": "Demonstration knowledge can be transferred across unseen applications via semantic retrieval.", "source": "2504.13805"}, {"type": "theoretical", "text": "Structured semantic descriptions enhance the retrievability and usability of demonstration knowledge.", "source": "2504.13805"}, {"type": "validation", "text": "Small models (7B) with retrieval augmentation can match the performance of large models (GPT-4o) without it.", "source": "2504.13805"}, {"type": "validation", "text": "Removing retrieval or parsing modules significantly degrades agent performance (proven via ablation studies).", "source": "2504.13805"}, {"type": "theoretical", "text": "System-level integration enhances automation robustness compared to application-layer scripts.", "source": "2504.14603"}, {"type": "theoretical", "text": "AgentOS abstraction enables non-intrusive desktop aut ": "人工监督公理：关键进化节点需保留人工干预或停止机制", "source": "2505.22954"}, {"type": "theoretical", "text": "Accessing global context with relevant extraction enables memory-aware generation without 3D reconstruction", "source": "2506.03141"}, {"type": "theoretical", "text": "Context-as-Memory paradigm avoids information compression loss inherent in latent compression methods", "source": "2506.03141"}, {"type": "validation", "text": "20-frame context window optimizes the performance-speed trade-off for interactive generation", "source": "2506.03141"}, {"type": "validation", "text": "PSNR and LPIPS metrics effectively quantify memory capability in video generation tasks", "source": "2506.03141"}, {"type": "theoretical", "text": "Multi-agent systems require hierarchical memory structures to enable effective self-evolution", "source": "2506.07398"}, {"type": "theoretical", "text": "Effective memory retrieval necessitates bi-directional traversal between abstract insights and concrete interactions", "source": "2506.07398"}, {"type": "validation", "text": "Hierarchical memory architecture improves embodied action success rates without modifying underlying MAS frameworks", "source": "2506.07398"}, {"type": "validation", "text": "Absorbing new collaboration trajectories promotes progressive system evolution and measurable performance gain", "source": "2506.07398"}, {"type": "theoretical", "text": "Memory as Reasoning Paradigm: Memory consolidation is viewed as part of the reasoning process.", "source": "2506.15841"}, {"type": "theoretical", "text": "Constant Memory Constraint: Efficient long-horizon processing can be achieved with constant memory footprint.", "source": "2506.15841"}, {"type": "validation", "text": "RL Training Superiority: RL training outperforms SFT in long-horizon tasks beyond 6 steps.", "source": "2506.15841"}, {"type": "validation", "text": "Efficiency-Performance Tradeoff: A 7B model with MEM1 can outperform a 14B model with full context while using less compute.", "sou emain within API limit (e.g., 128) to prevent failure", "source": "2507.21428"}, {"type": "theoretical", "text": "Small models lack reliability for autonomous tool context management", "source": "2507.21428"}, {"type": "validation", "text": "Hybrid mode achieves >90% removal rate with high task completion on reasoning models", "source": "2507.21428"}, {"type": "validation", "text": "System prompt must include dynamic tool count variable for effective removal", "source": "2507.21428"}, {"type": "theoretical", "text": "Hierarchical semantic abstraction improves retrieval efficiency compared to flat structures", "source": "2507.22925"}, {"type": "theoretical", "text": "Memory retention follows a forgetting curve modulated by user feedback reinforcement", "source": "2507.22925"}, {"type": "validation", "text": "Index routing retrieval outperforms full similarity search in latency and precision", "source": "2507.22925"}, {"type": "validation", "text": "Dynamic weight regulation significantly improves long-term dialogue coherence", "source": "2507.22925"}, {"type": "theoretical", "text": "检索模式可以通过参数化方式学习并内化到模型中", "source": "2508.01832"}, {"type": "theoretical", "text": "参数化记忆可以替代非参数检索实现高效知识访问", "source": "2508.01832"}, {"type": "theoretical", "text": "检索收益可以转化为完全参数化形式而无需外部文档访问", "source": "2508.01832"}, {"type": "validation", "text": "MLP Memory 在 5 个 QA 基准上相对提升 12.3% 准确率", "source": "2508.01832"}, {"type": "validation", "text": "MLP Memory 推理速度比 RAG 快 2.5 倍 (TTFT/TPS 指标)", "source": "2508.01832"}, {"type": "validation", "text": "MLP Memory 在 HaluEval 上减少幻觉高达 10 个点", "source": "2508.01832"}, {"type": "validation", "text": "MLP Memory 在 9 个通用 NLP 任务上绝对提升 5.2 分", "source": "2508.01832"}, {"type": "theoretical", "text": "Event Segmentation Theory: Memory boundaries align with semantic shifts in interaction", "source": "2508.03341"}, {"type": "theoretical", "text": "Free Energy Principle: Memory evolution minimizes prediction error between expected and observed states", "sour ce System 1 Output reduces System 2 Load", "source": "2509.22315"}, {"type": "validation", "text": "System 2 Activation significantly improves Hard Task Accuracy", "source": "2509.22315"}, {"type": "theoretical", "text": "Memory and reasoning should be tightly interwoven rather than separated into distinct modules", "source": "2509.24704"}, {"type": "validation", "text": "Generative Latent Memory outperforms external retrieval memory systems on task success rates", "source": "2509.24704"}, {"type": "validation", "text": "Self-evolving memory functions emerge spontaneously through interaction without labeled data", "source": "2509.24704"}, {"type": "theoretical", "text": "记忆驱动的经验缩放是智能体能力扩展的新维度", "source": "2509.25140"}, {"type": "theoretical", "text": "泛化推理策略存储优于原始轨迹存储用于智能体学习", "source": "2509.25140"}, {"type": "theoretical", "text": "记忆质量与测试时计算投入存在协同优化关系", "source": "2509.25140"}, {"type": "validation", "text": "配备 ReasoningBank 的智能体在 Web 浏览和软件工程基准上优于现有记忆机制", "source": "2509.25140"}, {"type": "validation", "text": "MaTTS 机制对记忆质量提升具有必要性", "source": "2509.25140"}, {"type": "validation", "text": "智能体可通过历史经验实现自我进化能力", "source": "2509.25140"}, {"type": "theoretical", "text": "记忆构建过程可以通过强化学习进行端到端优化，而非依赖手工规则", "source": "2509.25911"}, {"type": "theoretical", "text": "混合记忆结构比单一结构更能有效支持长上下文任务", "source": "2509.25911"}, {"type": "validation", "text": "在短序列 (30k tokens) 上训练的策略可以泛化至长序列 (400k+ tokens) 推理", "source": "2509.25911"}, {"type": "validation", "text": "基于 RL 的记忆管理在问答准确率上显著优于基于规则的记忆系统基线", "source": "2509.25911"}, {"type": "theoretical", "text": "Natural Language Optimization Axiom: Optimizing compression policies in natural language space bypasses discrete token gradient constraints", "source": "2510.00615"}, {"type": "theoretical", "text": "Dual-Objective Priority Axiom: Task utility must be maximized before context compression is enforced to prevent information loss", "source": "2510.00615"}, {"type": "validation", "text": "Cost-Accuracy Pareto Axiom: Significant token reduction (26-54%) can be achieved without degrading task accuracy", "source": "2510.00615"}, {"type": "validation", "text": "Small Model Enhancement Axiom: Compression mechanisms disproportionately benefit smaller models in long-horizon tasks by reducing context overload", "source": "2510.00615"}, {"type": "theoretical", "text": "Knowledge and reasoning capabilities can be decoupled at the parameter level within neural networks", "source": "2510.02375"}, {"type": "theoretical", "text": "Long-tail knowledge can be stored externally in parameters without retraining the main anchor model", "source": "2510.02375"}, {"type": "validation", "text": "A 160M model augmented with 18M memory parameters performs comparably to a dense model with 2x parameters", "source": "2510.02375"}, {"type": "validation", "text": "Long-tail knowledge accuracy improves significantly (e.g., 17% to 83%) with hierarchical memory augmentation", "source": "2510.02375"}, {"type": "theoretical", "text": "全量重写会导致上下文坍塌 (Context Collapse)", "source": "2510.04618"}, {"type": "theoretical", "text": "优化过程倾向于产生简洁性偏差 (Brevity Bias)", "source": "2510.04618"}, {"type": "theoretical", "text": "增量更新比全量重写更能保留知识多样性", "source": "2510.04618"}, {"type": "validation", "text": "ACE 框架在降低 80% 以上 Token 成本的同时保持或提升准确率", "source": "2510.04618"}, {"type": "validation", "text": "增量更新机制有效防止了长程任务中的知识丢失", "source": "2510.04618"}, {"type": "theoretical", "text": "Role-specific memory allocation optimizes multi-agent system performance (角色特定的记忆分配优化多智能体系统性能)", "source": "2510.04851"}, {"type": "theoretical", "text": "Procedural memory can compensate for model capacity limitations in workflows (过程记忆可弥补工作流中模型能力的不足)", "source": "2510.04851"}, {"type": "validation", "text": "Orchestrator memory significantly improves planning accuracy (编排器记忆显著提升规划准确性)", "source": "2510.04851"}, {"type": "validation", "text": "Small models with LEGOMem approximate large model performance (配备 LEGOMem 的小模型可接近大模型性能)", "source": "2510.04851"}, {"type": "         var lexicon = null;
        var ontologyMarkdown = '';

        async function init() {
            try {
                // Primary: use data embedded at build time (no fetch needed)
                if (typeof LEXICON_EMBEDDED !== 'undefined') {
                    lexicon = LEXICON_EMBEDDED;
                    console.log('Using embedded lexicon:', lexicon.conceptCount, 'concepts');
                } else {
                    var lexRes = await fetch(LEXICON_URL + '?t=' + Date.now());
                    if (!lexRes.ok) throw new Error('lexicon.json 加载失败 (' + lexRes.status + ')');
                    lexicon = await lexRes.json();
                }

                if (typeof ONTOLOGY_EMBEDDED !== 'undefined') {
                    ontologyMarkdown = ONTOLOGY_EMBEDDED;
                    console.log('Using embedded ontology:', ontologyMarkdown.length, 'chars');
                } else {
                    var ontoRes = await fetch(ONTOLOGY_URL + '?t=' + Date.now());
                    if (ontoRes.ok) {
                        ontologyMarkdown = await ontoRes.text();
                    }
                }

                renderWordCloud();
                renderSidebar();
                renderOntologyBody();
            } catch (err) {
                console.error('初始化失败:', err);
                document.getElementById('ontology-body').innerHTML =
                    '<p style="color:#ef4444;">数据加载失败: ' + escapeHtml(err.message) + '</p>' +
                    '<p style="color:var(--text-secondary);margin-top:0.5rem;">请确保通过 HTTP 服务器访问（如 python3 -m http.server），而非直接打开 HTML 文件。</p>';
                document.getElementById('wordcloud-container').innerHTML =
                    '<div class="wordcloud-error"><h3>数据加载失败</h3><p>' + escapeHtml(err.message) + '</p></div>';
            }
        }

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }

        function renderWordCloud() {
            var concepts = lexicon.concepts.filter(function(c) { return c.weight >= 2; });
            if (concepts.length === 0) return;

            // Build lookup at IIFE scope for click handler
            conceptLookup = {};
            concepts.forEach(function(c) { conceptLookup[c.name] = c; });

            var colorMap = {};
            for (var key in lexicon.categories) {
                if (lexicon.categories.hasOwnProperty(key)) {
                    colorMap[key] = lexicon.categories[key].color;
                }
            }

            try {
                window._wordCloud = createWordCloud('wordcloud-container', concepts, colorMap);
            } catch (err) {
                console.error('词云渲染失败:', err);
                document.getElementById('wordcloud-container').innerHTML =
                    '<div class="wordcloud-error"><h3>词云渲染失败</h3><p>' + escapeHtml(err.message) + '</p></div>';
            }
        }

        function showPaperSection(word) {
            var concept = word._concept || word;
            var name = concept.name || word.text;
            var papers = concept.sourcePapers || [];

            var section = document.getElementById('paper-section');
            var title = document.getElementById('selected-concept');
            var grid = document.getElementById('paper-grid');

            var catInfo = lexicon.categories[concept.category] || {name: concept.category, color: '#94a3b8'};
            title.textContent = name;
            title.style.color = catInfo.color;

            if (papers.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-secondary);">暂无关联论文</p>';
            } else {
                grid.innerHTML = papers.map(function(arxivId) {
                    var paperPath = PAPER_MAP[arxivId] || ((PAPER_MAP[arxivId] || ('paper/search/' + arxivId)));
                    return '<div class="paper-card">' +
                        '<span class="arxiv">' + escapeHtml(arxivId) + '</span>' +
                        '<p class="desc">概念 "' + escapeHtml(name) + '" 的来源论文</p>' +
                        '<a href="' + GITHUB_PAGES_BASE + paperPath + '" class="paper-link" target="_blank">查看完整报告 &rarr;</a>' +
                        '</div>';
                }).join('');
            }

            section.style.display = 'block';
            section.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function renderSidebar() {
            var nav = document.getElementById('sidebar-nav');
            if (!ontologyMarkdown) {
                nav.innerHTML = '<p style="font-size:0.82rem;color:var(--text-secondary);">本体正文未加载</p>';
                return;
            }

            var cleanMd = ontologyMarkdown.replace(/^---\n[\s\S]*?\n---\n?/, '');
            var headings = [];
            var regex = /^(#{2,3})\s+(.+)$/gm;
            var match;
            while ((match = regex.exec(cleanMd)) !== null) {
                var level = match[1].length;
                var text = match[2].replace(/[*_`]/g, '').trim();
                var id = text.toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g, '-');
                headings.push({ level: level, text: text, id: id });
            }

            nav.innerHTML = headings.map(function(h) {
                var indent = (h.level - 2) * 0.75 + 0.75;
                return '<a href="#' + h.id + '" style="padding-left:' + indent + 'rem">' + h.text + '</a>';
            }).join('');
        }

        function renderOntologyBody() {
            var body = document.getElementById('ontology-body');
            if (!ontologyMarkdown) {
                body.innerHTML = '<p style="color:var(--text-secondary);">本体论正文加载中...</p>';
                return;
            }

            // Strip YAML frontmatter (--- ... ---)
            var cleanMd = ontologyMarkdown.replace(/^---\n[\s\S]*?\n---\n?/, '');

            try {
                body.innerHTML = marked.parse(cleanMd);

                // Convert mermaid code blocks to divs for mermaid rendering
                var mermaidBlocks = body.querySelectorAll('code.language-mermaid');
                for (var i = 0; i < mermaidBlocks.length; i++) {
                    var code = mermaidBlocks[i];
                    var pre = code.parentElement;
                    var div = document.createElement('div');
                    div.className = 'mermaid';
                    div.textContent = code.textContent;
                    pre.replaceWith(div);
                }

                // Render all mermaid diagrams
                if (body.querySelectorAll('.mermaid').length > 0) {
                    try {
                        mermaid.run({nodes: body.querySelectorAll('.mermaid')});
                    } catch (e) {
                        console.warn('Mermaid render failed:', e);
                    }
                }
            } catch (err) {
                body.innerHTML = '<p style="color:#ef4444;">正文渲染失败: ' + escapeHtml(err.message) + '</p>';
                return;
            }

            var h2h3 = body.querySelectorAll('h2, h3');
            for (var i = 0; i < h2h3.length; i++) {
                var id = h2h3[i].textContent.toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g, '-');
                h2h3[i].id = id;
            }
        }

        init();

        // ── Render paper browsing list ──
        function renderPaperList() {
            var container = document.getElementById('paper-list-container');
            if (!container || typeof PAPER_LIST === 'undefined') return;

            var html = '';
            var yearKeys = Object.keys(PAPER_LIST).sort().reverse();
            for (var y = 0; y < yearKeys.length; y++) {
                var year = yearKeys[y];
                var papers = PAPER_LIST[year];
                html += '<div class="year-group">';
                html += '<span class="year-badge">' + year + '</span>';
                html += '<span class="year-count">' + papers.length + ' 篇</span>';
                html += '<div class="paper-list">';
                for (var i = 0; i < papers.length; i++) {
                    var p = papers[i];
                    html += '<div class="paper-item">';
                    html += '<span class="paper-arxiv">' + escapeHtml(p.arxivId) + '</span>';
                    html += '<div class="paper-title">' + escapeHtml(p.title) + '</div>';
                    html += '<a class="paper-link" href="' + GITHUB_PAGES_BASE + p.path + '">阅读简报 →</a>';
                    html += '</div>';
                }
                html += '</div></div>';
            }
            container.innerHTML = html;
        }

        renderPaperList();

        var resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                if (window._wordCloud && window._wordCloud.stop) window._wordCloud.stop();
                renderWordCloud();
            }, 250);
        });
    })();
    </script>
