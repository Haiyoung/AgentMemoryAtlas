name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site from lexicon
        run: |
          python3 scripts/build-site.py || echo "Site build failed, continuing with existing index.html"

      - name: Copy papers to site
        run: |
          mkdir -p site/paper
          cp -r paper/2026 site/paper/ 2>/dev/null || echo "No 2026 papers"
          cp -r paper/2025 site/paper/ 2>/dev/null || echo "No 2025 papers"
          cp -r paper/2024 site/paper/ 2>/dev/null || echo "No 2024 papers"
          cp -r paper/2023 site/paper/ 2>/dev/null || echo "No 2023 papers"
          cp -r paper/2022 site/paper/ 2>/dev/null || echo "No 2022 papers"
          cp -r paper/2021 site/paper/ 2>/dev/null || echo "No 2021 papers"

      - name: Copy ontology data to site
        run: |
          mkdir -p site/ontology
          cp ontology/lexicon.json site/ontology/
          cp ontology/ontology_base.md site/ontology/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
